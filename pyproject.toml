[project]
name = "abarrotes"
version = "1.0.0"
description = "Backend para sistema de abarrotes — Django REST Framework + Supabase"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.2,<5.3",
    "djangorestframework>=3.16,<4",
    "djangorestframework-simplejwt>=5.5,<6",
    "django-cors-headers>=4.9,<5",
    "dj-database-url>=3.1,<4",
    "psycopg[binary]>=3.3,<4",
    "Pillow>=12,<14",
    "django-storages[s3]>=1.14,<2",
    "argon2-cffi>=25,<26",
    "whitenoise>=6.12,<7",
    "gunicorn>=23",
]

[tool.uv]
dev-dependencies = [
    "coverage>=7",
    "pytest>=8",
    "pytest-django>=4",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
